memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120

; Giữ opcache kiểm tra timestamp để sửa code PHP là thấy ngay (hợp cho DEV).
; PROD có thể đặt opcache.validate_timestamps = 0 để nhanh hơn (nhớ deploy lại khi đổi code).
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
