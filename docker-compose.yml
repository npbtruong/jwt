# docker-compose.yml — webhook-receiver microservice (DEV)
name: webhook-receiver

services:
  # PHP-FPM: serves the HTTP API (artisan, composer run here too).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: webhook-app
    container_name: wr_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - webhook

  # Nginx: reverse proxy -> app:9000, document root public/.
  nginx:
    image: nginx:1.27-alpine
    container_name: wr_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - webhook

  # Queue worker: SAME image as app, but runs the notifications queue instead
  # of serving HTTP. Statelessness lets you scale it independently:
  #     docker compose up -d --scale worker=4
  # No container_name so replicas don't collide on a fixed name.
  worker:
    image: webhook-app
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --queue=notifications --tries=3 --backoff=10 --max-time=3600 --sleep=1 -v
    volumes:
      - ./:/var/www/html
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - webhook

  # MySQL 8: this service's OWN database (named volume => survives restarts).
  mysql:
    image: mysql:8.0
    container_name: wr_mysql
    command: --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-webhook}
      MYSQL_USER: ${DB_USERNAME:-webhook}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - webhook

  # Redis: idempotency store + queue backend.
  redis:
    image: redis:7-alpine
    container_name: wr_redis
    networks:
      - webhook

  # phpMyAdmin (optional): inspect the reservations table at http://localhost:8081
  phpmyadmin:
    image: phpmyadmin:5
    container_name: wr_pma
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - webhook

volumes:
  mysqldata:

networks:
  webhook:
    driver: bridge
